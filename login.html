<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar · Finaliza Odonto</title>
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/estilo.css">
</head>
<body>
    <main class="publica">
        <div class="publica__caixa">
            <div class="publica__marca">
                <img src="assets/img/logo.svg" alt="">
                <div><strong>Finaliza Odonto</strong><span>AmorSaúde São João del-Rei</span></div>
            </div>
            <div class="cartao">
                <h1>Entrar</h1>
                <p class="sub">Acompanhe e finalize os procedimentos registrados.</p>
                <form id="form-login" novalidate>
                    <div class="campo">
                        <label for="usuario">Usuário</label>
                        <input id="usuario" class="entrada" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
                    </div>
                    <div class="campo">
                        <label for="senha">Senha</label>
                        <div class="campo-senha">
                            <input id="senha" type="password" class="entrada" autocomplete="current-password" required>
                            <button type="button" class="btn btn--fantasma btn--icone btn--sm" id="mostrar-senha" aria-label="Mostrar senha" aria-pressed="false"><i data-icone="olho"></i></button>
                        </div>
                    </div>
                    <p class="mensagem mensagem--erro" id="erro" role="alert" hidden></p>
                    <button type="submit" class="btn btn--primario btn--bloco" id="entrar">Entrar</button>
                </form>
            </div>
            <p class="rodape">Quer registrar um procedimento? <a href="index.html">Abrir formulário</a></p>
        </div>
    </main>
    <script type="module" src="assets/js/paginas/login.js"></script>
</body>
</html>
