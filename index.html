<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar procedimento · Finaliza Odonto</title>
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/estilo.css">
</head>
<body>
    <main class="publica">
        <div class="publica__caixa">
            <div class="publica__marca">
                <img src="assets/img/logo.svg" alt="">
                <div><strong>Finaliza Odonto</strong><span>AmorSaúde São João del-Rei</span></div>
            </div>
            <div class="cartao">
                <h1>Registrar procedimento</h1>
                <p class="sub">Informe o procedimento concluído para a administração dar baixa.</p>
                <form id="form-registro" novalidate>
                    <div class="grupo-2">
                        <div class="campo">
                            <label for="unidade">Unidade</label>
                            <select id="unidade" class="entrada" required></select>
                        </div>
                        <div class="campo">
                            <label for="profissional">Profissional</label>
                            <select id="profissional" class="entrada" required disabled>
                                <option value="">Carregando...</option>
                            </select>
                        </div>
                    </div>
                    <div class="campo">
                        <label for="paciente">Nome do paciente</label>
                        <input id="paciente" class="entrada" required maxlength="200" autocomplete="off" placeholder="Nome completo">
                    </div>
                    <div class="campo">
                        <label for="procedimento">Procedimento</label>
                        <textarea id="procedimento" class="entrada" required maxlength="2000" placeholder="Ex.: restauração dente 26, limpeza bonificada"></textarea>
                        <span class="ajuda">Inclua dente/região e qualquer detalhe que ajude na baixa.</span>
                    </div>
                    <div id="mensagem" role="status" aria-live="polite"></div>
                    <button type="submit" class="btn btn--primario btn--bloco" id="registrar"><i data-icone="enviar"></i>Registrar</button>
                </form>
                <p class="texto-3 pequeno" id="sessao" style="margin-top:12px;text-align:center" hidden></p>
            </div>
            <p class="rodape"><a href="login.html">Entrar para acompanhar ou finalizar <span aria-hidden="true">→</span></a></p>
        </div>
    </main>
    <script type="module" src="assets/js/paginas/formulario.js"></script>
</body>
</html>
